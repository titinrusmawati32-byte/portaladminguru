<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5846B5" />
      <stop offset="50%" stop-color="#6C5CE7" />
      <stop offset="100%" stop-color="#7C6EE6" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#4338CA" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Rounded App Tile -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />

  <!-- Inner Soft Ambient Ring -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="none" stroke="rgba(255,255,255,0.22)" stroke-width="4" />

  <!-- Graduation Cap Icon -->
  <g filter="url(#glow)">
    <!-- Cap Top Diamond -->
    <path d="M256 120 L440 215 L256 310 L72 215 Z" fill="#FFFFFF" />
    <!-- Cap Skull Base -->
    <path d="M140 252 V330 C140 376 256 410 256 410 C256 410 372 376 372 330 V252 L256 312 Z" fill="#EAE7FB" opacity="0.95" />
    <!-- Tassel String and Pendant -->
    <path d="M390 230 V350" stroke="url(#goldGrad)" stroke-width="12" stroke-linecap="round" />
    <circle cx="390" cy="365" r="14" fill="url(#goldGrad)" />
    <!-- Center Button -->
    <ellipse cx="256" cy="215" rx="14" ry="8" fill="url(#goldGrad)" />
  </g>
</svg>
